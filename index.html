<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="button-grid">
            <button class="system" data-action="clear">C</button>
            <button class="system" data-action="backspace">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path d="M21 3H9L3 12l6 9h12V3zm-4 5l-4 4 4 4-1.4 1.4L10.2 12l5.4-5.4L17 8z"/>
                </svg>
            </button>
            <button class="operator" data-value="/">&divide;</button>
            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="*">×</button>
            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="-">-</button>
            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operator" data-value="+">+</button>
            <button class="number" data-value="0">0</button>
            <button class="operator" data-value="=">=</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
